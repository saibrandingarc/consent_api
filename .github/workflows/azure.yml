name: Build and deploy consent_api

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@12.5.1 --activate
      - name: Build
        env:
          CM_DATABASE_URL: sqlserver://localhost:1433;database=cmp;user=sa;password=Placeholder_1;encrypt=true;trustServerCertificate=true
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
          WEB_URL: ${{ vars.WEB_URL || 'https://consentmngtdev-gtfgamd4c9b4bbcr.eastus2-01.azurewebsites.net' }}
          ADMIN_URL: ${{ vars.ADMIN_URL || 'https://consentadmin-fwb7gmeybmhwhyd0.eastus2-01.azurewebsites.net' }}
        run: |
          pnpm install
          pnpm build
          pnpm --filter=consent_api deploy --prod ./azure-api
          SCHEMA="$(find ./azure-api/node_modules -path '*/@cmp/database/prisma/schema.prisma' -print -quit)"
          test -n "$SCHEMA"
          SRC_CLIENT="$(find node_modules/.pnpm -type d -path '*@prisma+client@*/node_modules/.prisma/client' | head -1)"
          test -n "$SRC_CLIENT"
          mkdir -p azure-api/node_modules/.prisma
          rm -rf azure-api/node_modules/.prisma/client
          cp -R "$SRC_CLIENT" azure-api/node_modules/.prisma/client
          while IFS= read -r dest; do
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            cp -R "$SRC_CLIENT" "$dest"
          done < <(find azure-api/node_modules -type d -path '*@prisma+client@*/node_modules/.prisma/client' 2>/dev/null || true)
          bash deploy/azure/assemble.sh
      - uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ vars.AZURE_API_APP || 'consentapi' }}
          package: azure-site-api
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE || secrets.AZUREAPPSERVICE_PUBLISHPROFILE_38665C48D1084237BBB1F8D29CABCDFB }}
